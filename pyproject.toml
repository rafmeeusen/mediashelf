[project]
name = "mediashelf"
version = "0.1.0"
description = "Personal media tracker: movies, books, TV series, podcasts"
authors = [
    { name = "Raf Meeusen", email = "raf@meeusen.net" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.ruff.lint]
# B008: FastAPI's `Depends(...)` in argument defaults is the idiomatic pattern.
ignore = ["B008"]
